<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Lakbay Market splash mark: a leaf inside a map pin.
    Transparent background on purpose: the splash background colour comes from the
    Color attribute on the MauiSplashScreen entry in LakbayMarket.App.csproj.
    Colours are the project's design tokens: cream #F8F5EE, terracotta #B65E3F.
    Flat fills only (no gradients, filters or text) so the MAUI resizetizer renders it identically everywhere.
    The whole mark sits inside a circle of about two thirds of the canvas, so Android 12+'s circular crop cannot clip it.
  -->
  <path fill="#F8F5EE" d="M64 102 C64 102 39 79 39 51 A25 25 0 0 1 89 51 C89 79 64 102 64 102 Z"/>
  <path fill="#B65E3F" d="M54 60 C51 46 62 37 76 39 C78 51 68 63 54 60 Z"/>
  <path fill="none" stroke="#B65E3F" stroke-width="3.4" stroke-linecap="round" d="M54 60 L49.5 65"/>
</svg>
